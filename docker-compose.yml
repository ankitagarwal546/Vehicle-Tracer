services:
  backend:
    build: ./backend
    environment:
      DEVICE: cpu
    volumes:
      - vehicle_tracer_storage:/srv/backend/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"

volumes:
  vehicle_tracer_storage:
