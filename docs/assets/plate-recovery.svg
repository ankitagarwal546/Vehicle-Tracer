<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="t d"><title id="t">Multi-frame plate recovery</title><desc id="d">Three partial reads combine into one plate, and the unseen character stays unknown.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f3f1fb} .n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .m{fill:#c4c0d8} .y{fill:#f6d743} .v{fill:#c4baff}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes run{0%{stroke-dashoffset:0;opacity:0}6%,92%{opacity:1}100%{stroke-dashoffset:-100;opacity:0}}
@keyframes scan{0%{transform:translateY(0);opacity:0}12%,84%{opacity:1}100%{transform:translateY(23px);opacity:0}}
@keyframes pop{0%,18%{opacity:.14}30%,100%{opacity:1}}
.draw{stroke-dasharray:100;animation:draw 1s ease-in-out both} .run{stroke-dasharray:.01 100;animation:run 3.4s linear infinite}
.scan{animation:scan 2.6s ease-in-out infinite} .pop{animation:pop 4.8s ease-out infinite alternate}
@media (prefers-reduced-motion:reduce){.draw,.run,.scan,.pop{animation:none}.run{stroke-dashoffset:-99.9}.scan{transform:translateY(10px)}}
</style><defs>
<linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0a1c"/><stop offset=".62" stop-color="#191236"/><stop offset="1" stop-color="#2b1d55"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6a53e6" stop-opacity=".5"/><stop offset="1" stop-color="#6a53e6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".055"/></pattern>
<clipPath id="cone"><path d="M7 8L20 33L33 8Z"/></clipPath>
</defs><rect width="1200" height="480" rx="16" fill="url(#bgg)"/><rect width="1200" height="480" rx="16" fill="url(#dots)"/><text x="36" y="48" font-size="26" font-weight="650">How one plate is recovered from many frames</text><text x="36" y="76" font-size="15" class="m">Demo plate. Each column is judged separately, using only what real frames showed.</text><text x="173.0" y="104" text-anchor="middle" font-size="13" class="m n">1</text><text x="227.0" y="104" text-anchor="middle" font-size="13" class="m n">2</text><text x="281.0" y="104" text-anchor="middle" font-size="13" class="m n">3</text><text x="335.0" y="104" text-anchor="middle" font-size="13" class="m n">4</text><text x="389.0" y="104" text-anchor="middle" font-size="13" class="m n">5</text><text x="443.0" y="104" text-anchor="middle" font-size="13" class="m n">6</text><text x="497.0" y="104" text-anchor="middle" font-size="13" class="m n">7</text><text x="551.0" y="104" text-anchor="middle" font-size="13" class="m n">8</text><text x="36" y="142" font-size="15" class="m n">Frame 18</text><g><rect x="150" y="112" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="173.0" y="143.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">D</text></g><g><rect x="204" y="112" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="227.0" y="143.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">E</text></g><g><rect x="258" y="112" width="46" height="46" rx="5" fill="#fff" fill-opacity=".05"/><text x="281.0" y="143.7" text-anchor="middle" font-size="24" font-weight="700" class="n m">?</text></g><g><rect x="312" y="112" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="335.0" y="143.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">O</text></g><g><rect x="366" y="112" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="389.0" y="143.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">4</text></g><g><rect x="420" y="112" width="46" height="46" rx="5" fill="#fff" fill-opacity=".05"/><text x="443.0" y="143.7" text-anchor="middle" font-size="24" font-weight="700" class="n m">?</text></g><g><rect x="474" y="112" width="46" height="46" rx="5" fill="#fff" fill-opacity=".05"/><text x="497.0" y="143.7" text-anchor="middle" font-size="24" font-weight="700" class="n m">?</text></g><g><rect x="528" y="112" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="551.0" y="143.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">2</text></g><text x="36" y="198" font-size="15" class="m n">Frame 31</text><g><rect x="150" y="168" width="46" height="46" rx="5" fill="#fff" fill-opacity=".05"/><text x="173.0" y="199.7" text-anchor="middle" font-size="24" font-weight="700" class="n m">?</text></g><g><rect x="204" y="168" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="227.0" y="199.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">E</text></g><g><rect x="258" y="168" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="281.0" y="199.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">M</text></g><g><rect x="312" y="168" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="335.0" y="199.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">O</text></g><g><rect x="366" y="168" width="46" height="46" rx="5" fill="#fff" fill-opacity=".05"/><text x="389.0" y="199.7" text-anchor="middle" font-size="24" font-weight="700" class="n m">?</text></g><g><rect x="420" y="168" width="46" height="46" rx="5" fill="#fff" fill-opacity=".05"/><text x="443.0" y="199.7" text-anchor="middle" font-size="24" font-weight="700" class="n m">?</text></g><g><rect x="474" y="168" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="497.0" y="199.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">7</text></g><g><rect x="528" y="168" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="551.0" y="199.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">2</text></g><text x="36" y="254" font-size="15" class="m n">Frame 47</text><g><rect x="150" y="224" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="173.0" y="255.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">D</text></g><g><rect x="204" y="224" width="46" height="46" rx="5" fill="#fff" fill-opacity=".05"/><text x="227.0" y="255.7" text-anchor="middle" font-size="24" font-weight="700" class="n m">?</text></g><g><rect x="258" y="224" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="281.0" y="255.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">M</text></g><g><rect x="312" y="224" width="46" height="46" rx="5" fill="#fff" fill-opacity=".05"/><text x="335.0" y="255.7" text-anchor="middle" font-size="24" font-weight="700" class="n m">?</text></g><g><rect x="366" y="224" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="389.0" y="255.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">4</text></g><g><rect x="420" y="224" width="46" height="46" rx="5" fill="#fff" fill-opacity=".05"/><text x="443.0" y="255.7" text-anchor="middle" font-size="24" font-weight="700" class="n m">?</text></g><g><rect x="474" y="224" width="46" height="46" rx="5" fill="#fff" fill-opacity=".16"/><text x="497.0" y="255.7" text-anchor="middle" font-size="24" font-weight="700" class="n ">7</text></g><g><rect x="528" y="224" width="46" height="46" rx="5" fill="#fff" fill-opacity=".05"/><text x="551.0" y="255.7" text-anchor="middle" font-size="24" font-weight="700" class="n m">?</text></g><line x1="36" x2="582" y1="291" y2="291" stroke="#fff" stroke-opacity=".22"/><text x="36" y="338" font-size="16" font-weight="700" class="y n">Fused</text><g class="pop" style="animation-delay:0.20s"><rect x="150" y="306" width="46" height="46" rx="5" fill="#f4f1ff"/><text x="173.0" y="337.7" text-anchor="middle" font-size="24" font-weight="700" class="n " style="fill:#14101f">D</text></g><g class="pop" style="animation-delay:0.34s"><rect x="204" y="306" width="46" height="46" rx="5" fill="#f4f1ff"/><text x="227.0" y="337.7" text-anchor="middle" font-size="24" font-weight="700" class="n " style="fill:#14101f">E</text></g><g class="pop" style="animation-delay:0.48s"><rect x="258" y="306" width="46" height="46" rx="5" fill="#f4f1ff"/><text x="281.0" y="337.7" text-anchor="middle" font-size="24" font-weight="700" class="n " style="fill:#14101f">M</text></g><g class="pop" style="animation-delay:0.62s"><rect x="312" y="306" width="46" height="46" rx="5" fill="#f4f1ff"/><text x="335.0" y="337.7" text-anchor="middle" font-size="24" font-weight="700" class="n " style="fill:#14101f">O</text></g><g class="pop" style="animation-delay:0.76s"><rect x="366" y="306" width="46" height="46" rx="5" fill="#f4f1ff"/><text x="389.0" y="337.7" text-anchor="middle" font-size="24" font-weight="700" class="n " style="fill:#14101f">4</text></g><g class="pop" style="animation-delay:0.90s"><rect x="420" y="306" width="46" height="46" rx="5" fill="#2a2147" stroke="#f6d743" stroke-dasharray="4 3"/><text x="443.0" y="337.7" text-anchor="middle" font-size="24" font-weight="700" class="n y">?</text></g><g class="pop" style="animation-delay:1.04s"><rect x="474" y="306" width="46" height="46" rx="5" fill="#f4f1ff"/><text x="497.0" y="337.7" text-anchor="middle" font-size="24" font-weight="700" class="n " style="fill:#14101f">7</text></g><g class="pop" style="animation-delay:1.18s"><rect x="528" y="306" width="46" height="46" rx="5" fill="#f4f1ff"/><text x="551.0" y="337.7" text-anchor="middle" font-size="24" font-weight="700" class="n " style="fill:#14101f">2</text></g><path d="M443.0 357V376" stroke="#f6d743" stroke-width="2"/><text x="443.0" y="396" text-anchor="middle" font-size="14" class="y">No frame showed slot 6, so it stays ?</text><rect x="618" y="100" width="552" height="350" rx="14" fill="#151030" stroke="#c4baff" stroke-opacity=".38"/><text x="642" y="138" font-size="19" font-weight="650">A character becomes ? when</text><rect x="642" y="160" width="24" height="24" rx="5" fill="#2a2147" stroke="#f6d743" stroke-dasharray="3 3"/><text x="654" y="177" text-anchor="middle" font-size="14" font-weight="700" class="y n">?</text><text x="678" y="178" font-size="16" class="m">Fused confidence is below 0.55</text><rect x="642" y="197" width="24" height="24" rx="5" fill="#2a2147" stroke="#f6d743" stroke-dasharray="3 3"/><text x="654" y="214" text-anchor="middle" font-size="14" font-weight="700" class="y n">?</text><text x="678" y="215" font-size="16" class="m">Only one frame saw it, below 0.78 confidence</text><rect x="642" y="234" width="24" height="24" rx="5" fill="#2a2147" stroke="#f6d743" stroke-dasharray="3 3"/><text x="654" y="251" text-anchor="middle" font-size="14" font-weight="700" class="y n">?</text><text x="678" y="252" font-size="16" class="m">Fewer than two-thirds of frames agree</text><rect x="642" y="271" width="24" height="24" rx="5" fill="#2a2147" stroke="#f6d743" stroke-dasharray="3 3"/><text x="654" y="288" text-anchor="middle" font-size="14" font-weight="700" class="y n">?</text><text x="678" y="289" font-size="16" class="m">Frames repeatedly disagree on the character</text><rect x="642" y="308" width="24" height="24" rx="5" fill="#2a2147" stroke="#f6d743" stroke-dasharray="3 3"/><text x="654" y="325" text-anchor="middle" font-size="14" font-weight="700" class="y n">?</text><text x="678" y="326" font-size="16" class="m">It appears only after image enhancement</text><rect x="642" y="345" width="24" height="24" rx="5" fill="#2a2147" stroke="#f6d743" stroke-dasharray="3 3"/><text x="654" y="362" text-anchor="middle" font-size="14" font-weight="700" class="y n">?</text><text x="678" y="363" font-size="16" class="m">Reads disagree about the plate length</text><rect x="642" y="382" width="24" height="24" rx="5" fill="#2a2147" stroke="#f6d743" stroke-dasharray="3 3"/><text x="654" y="399" text-anchor="middle" font-size="14" font-weight="700" class="y n">?</text><text x="678" y="400" font-size="16" class="m">Its position was seen in too few frames</text></svg>