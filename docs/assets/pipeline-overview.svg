<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" role="img" aria-labelledby="t d"><title id="t">The VITRA pipeline</title><desc id="d">Ingest, Detect, Recover, Match and Review, with each stage&#x27;s output.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#f3f1fb} .n{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace} .m{fill:#c4c0d8} .y{fill:#f6d743} .v{fill:#c4baff}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes run{0%{stroke-dashoffset:0;opacity:0}6%,92%{opacity:1}100%{stroke-dashoffset:-100;opacity:0}}
@keyframes scan{0%{transform:translateY(0);opacity:0}12%,84%{opacity:1}100%{transform:translateY(23px);opacity:0}}
@keyframes pop{0%,18%{opacity:.14}30%,100%{opacity:1}}
.draw{stroke-dasharray:100;animation:draw 1s ease-in-out both} .run{stroke-dasharray:.01 100;animation:run 3.4s linear infinite}
.scan{animation:scan 2.6s ease-in-out infinite} .pop{animation:pop 4.8s ease-out infinite alternate}
@media (prefers-reduced-motion:reduce){.draw,.run,.scan,.pop{animation:none}.run{stroke-dashoffset:-99.9}.scan{transform:translateY(10px)}}
</style><defs>
<linearGradient id="bgg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0a1c"/><stop offset=".62" stop-color="#191236"/><stop offset="1" stop-color="#2b1d55"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6a53e6" stop-opacity=".5"/><stop offset="1" stop-color="#6a53e6" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".055"/></pattern>
<clipPath id="cone"><path d="M7 8L20 33L33 8Z"/></clipPath>
</defs><rect width="1200" height="410" rx="16" fill="url(#bgg)"/><rect width="1200" height="410" rx="16" fill="url(#dots)"/><text x="600" y="50" text-anchor="middle" font-size="28" font-weight="650">From raw CCTV to evidence you can defend</text><path d="M129.0 375V398H1049.0V375" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2"/><path class="run" pathLength="100" d="M129.0 375V398H1049.0V375" fill="none" stroke="#f6d743" stroke-width="7" stroke-linecap="round"/><rect x="25" y="96" width="208" height="278" rx="14" fill="#151030" stroke="#c4baff" stroke-opacity=".38"/><circle cx="55" cy="130" r="15" fill="#6a53e6"/><text x="55" y="136" text-anchor="middle" font-size="16" font-weight="700" class="n">1</text><text x="81" y="137" font-size="21" font-weight="650">Ingest</text><circle cx="47" cy="177" r="3" fill="#f6d743"/><text x="59" y="182" font-size="14.5" class="m">Hash every clip</text><circle cx="47" cy="207" r="3" fill="#f6d743"/><text x="59" y="212" font-size="14.5" class="m">Store it read-only</text><circle cx="47" cy="237" r="3" fill="#f6d743"/><text x="59" y="242" font-size="14.5" class="m">Record camera, time</text><circle cx="47" cy="267" r="3" fill="#f6d743"/><text x="59" y="272" font-size="14.5" class="m">and plate format</text><rect x="37" y="314" width="184" height="46" rx="8" fill="#f6d743" fill-opacity=".1" stroke="#f6d743" stroke-opacity=".45"/><text x="129.0" y="332" text-anchor="middle" font-size="11" class="y">OUTPUT</text><text x="129.0" y="350" text-anchor="middle" font-size="14" font-weight="650">Chain of custody</text><path d="M237 228.0l10 7-10 7" fill="none" stroke="#c4baff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="255" y="96" width="208" height="278" rx="14" fill="#151030" stroke="#c4baff" stroke-opacity=".38"/><circle cx="285" cy="130" r="15" fill="#6a53e6"/><text x="285" y="136" text-anchor="middle" font-size="16" font-weight="700" class="n">2</text><text x="311" y="137" font-size="21" font-weight="650">Detect</text><circle cx="277" cy="177" r="3" fill="#f6d743"/><text x="289" y="182" font-size="14.5" class="m">Detect with YOLOv8</text><circle cx="277" cy="207" r="3" fill="#f6d743"/><text x="289" y="212" font-size="14.5" class="m">Track with ByteTrack</text><circle cx="277" cy="237" r="3" fill="#f6d743"/><text x="289" y="242" font-size="14.5" class="m">Stitch broken tracks</text><circle cx="277" cy="267" r="3" fill="#f6d743"/><text x="289" y="272" font-size="14.5" class="m">Grade track quality</text><rect x="267" y="314" width="184" height="46" rx="8" fill="#f6d743" fill-opacity=".1" stroke="#f6d743" stroke-opacity=".45"/><text x="359.0" y="332" text-anchor="middle" font-size="11" class="y">OUTPUT</text><text x="359.0" y="350" text-anchor="middle" font-size="14" font-weight="650">Vehicle tracks</text><path d="M467 228.0l10 7-10 7" fill="none" stroke="#c4baff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="485" y="96" width="208" height="278" rx="14" fill="#151030" stroke="#c4baff" stroke-opacity=".38"/><circle cx="515" cy="130" r="15" fill="#6a53e6"/><text x="515" y="136" text-anchor="middle" font-size="16" font-weight="700" class="n">3</text><text x="541" y="137" font-size="21" font-weight="650">Recover</text><circle cx="507" cy="177" r="3" fill="#f6d743"/><text x="519" y="182" font-size="14.5" class="m">Read plates per frame</text><circle cx="507" cy="207" r="3" fill="#f6d743"/><text x="519" y="212" font-size="14.5" class="m">Compare OCR views</text><circle cx="507" cy="237" r="3" fill="#f6d743"/><text x="519" y="242" font-size="14.5" class="m">Fuse per character</text><circle cx="507" cy="267" r="3" fill="#f6d743"/><text x="519" y="272" font-size="14.5" class="m">Keep unknowns as ?</text><rect x="497" y="314" width="184" height="46" rx="8" fill="#f6d743" fill-opacity=".1" stroke="#f6d743" stroke-opacity=".45"/><text x="589.0" y="332" text-anchor="middle" font-size="11" class="y">OUTPUT</text><text x="589.0" y="350" text-anchor="middle" font-size="14" font-weight="650">Evidence-backed plate</text><path d="M697 228.0l10 7-10 7" fill="none" stroke="#c4baff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="715" y="96" width="208" height="278" rx="14" fill="#151030" stroke="#c4baff" stroke-opacity=".38"/><circle cx="745" cy="130" r="15" fill="#6a53e6"/><text x="745" y="136" text-anchor="middle" font-size="16" font-weight="700" class="n">4</text><text x="771" y="137" font-size="21" font-weight="650">Match</text><circle cx="737" cy="177" r="3" fill="#f6d743"/><text x="749" y="182" font-size="14.5" class="m">Check format coverage</text><circle cx="737" cy="207" r="3" fill="#f6d743"/><text x="749" y="212" font-size="14.5" class="m">Rank registry records</text><circle cx="737" cy="237" r="3" fill="#f6d743"/><text x="749" y="242" font-size="14.5" class="m">Apply 7 strict gates</text><circle cx="737" cy="267" r="3" fill="#f6d743"/><text x="749" y="272" font-size="14.5" class="m">Explain the result</text><rect x="727" y="314" width="184" height="46" rx="8" fill="#f6d743" fill-opacity=".1" stroke="#f6d743" stroke-opacity=".45"/><text x="819.0" y="332" text-anchor="middle" font-size="11" class="y">OUTPUT</text><text x="819.0" y="350" text-anchor="middle" font-size="14" font-weight="650">Candidate or no match</text><path d="M927 228.0l10 7-10 7" fill="none" stroke="#c4baff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="945" y="96" width="208" height="278" rx="14" fill="#151030" stroke="#c4baff" stroke-opacity=".38"/><circle cx="975" cy="130" r="15" fill="#6a53e6"/><text x="975" y="136" text-anchor="middle" font-size="16" font-weight="700" class="n">5</text><text x="1001" y="137" font-size="21" font-weight="650">Review</text><circle cx="967" cy="177" r="3" fill="#f6d743"/><text x="979" y="182" font-size="14.5" class="m">Inspect every frame</text><circle cx="967" cy="207" r="3" fill="#f6d743"/><text x="979" y="212" font-size="14.5" class="m">Confirm or reject links</text><circle cx="967" cy="237" r="3" fill="#f6d743"/><text x="979" y="242" font-size="14.5" class="m">Log every decision</text><circle cx="967" cy="267" r="3" fill="#f6d743"/><text x="979" y="272" font-size="14.5" class="m">Export the report</text><rect x="957" y="314" width="184" height="46" rx="8" fill="#f6d743" fill-opacity=".1" stroke="#f6d743" stroke-opacity=".45"/><text x="1049.0" y="332" text-anchor="middle" font-size="11" class="y">OUTPUT</text><text x="1049.0" y="350" text-anchor="middle" font-size="14" font-weight="650">Forensic report</text></svg>